# Nginx server block for the induction portal.
# Install: sudo cp deploy/nginx-induction.conf /etc/nginx/sites-available/induction
# Replace induction.example.com with your domain; certbot adds the HTTPS part.

server {
    listen 80;
    listen [::]:80;
    server_name induction.example.com;

    root /var/www/induction;
    index index.php index.html;

    client_max_body_size 70M;
    access_log /var/log/nginx/induction_access.log;
    error_log  /var/log/nginx/induction_error.log;

    # Hidden files (.git, .htaccess, .gitignore), except Let's Encrypt challenges
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Dumps, archives and logs left in the web root are never downloadable
    location ~ ^/[^/]+\.(sql|bak|zip|log)$ {
        deny all;
    }
    location ~ (^|/)error_log$ {
        deny all;
    }

    # Uploaded files are served as files only, never executed as PHP
    location ~* ^/(uploads|uploads_1|temp|siteadmin/uploads)/.*\.(php\d?|phtml|phar)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass unix:/run/php/php8.3-fpm-induction.sock;
        fastcgi_read_timeout 300;
    }
}
