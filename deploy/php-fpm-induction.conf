; Dedicated PHP-FPM pool for the induction portal, so its PHP settings
; don't affect other sites on this server.
; Install: sudo cp deploy/php-fpm-induction.conf /etc/php/8.3/fpm/pool.d/induction.conf
[induction]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-induction.sock
listen.owner = www-data
listen.group = www-data

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 70M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-induction.log
php_admin_value[date.timezone] = Asia/Kolkata
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.save_path] = /var/lib/php/sessions-induction
